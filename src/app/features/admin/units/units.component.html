<!-- src/app/features/admin/units/units.component.html -->

<div class="unit-management">

  <!-- Header -->
  <div class="page-header">
    <div class="header-left">
      <h1>Gestion des unités</h1>
      <p class="subtitle">Administrez les unités de vos résidences</p>
    </div>

    <div class="header-actions">
      <app-button *ngIf="isAdmin()" (btnClick)="openCreateModal()" variant="primary" icon="meeting_room">
        Ajouter Nouvelle unité
      </app-button>
    </div>
  </div>

  <!-- Stats & Filters Row -->
  <div class="top-row">

    <!-- Stats Card -->
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon total">
          <span class="emoji">🏠</span>
        </div>
        <div class="stat-content">
          <div class="stat-value">{{ units().length }}</div>
          <div class="stat-label">Total unités</div>
        </div>
      </div>
    </div>

    <!-- Filters Card -->
    <div class="filters-card">
      <form [formGroup]="searchForm" class="filters-grid">

        <!-- Residence filter -->
        <div class="filter-group">
          <label>Résidence</label>
          <select [formControl]="searchForm.controls.residenceUuid" class="filter-select">
            <option *ngFor="let opt of residenceOptions()" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>
        </div>

        <!-- Building filter -->
        <div class="filter-group">
          <label>Bâtiment</label>
          <select [formControl]="searchForm.controls.buildingUuid" class="filter-select">
            <option *ngFor="let opt of buildingOptions()" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>
        </div>

        <!-- Type filter -->
        <div class="filter-group">
          <label>Type</label>
          <select [formControl]="searchForm.controls.type" class="filter-select">
            <option *ngFor="let opt of typeOptions" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>
        </div>

        <!-- Occupancy filter -->
        <div class="filter-group">
          <label>Occupation</label>
          <select [formControl]="searchForm.controls.occupied" class="filter-select">
            <option *ngFor="let opt of occupancyOptions" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>
        </div>        
        <!-- Reset button -->
        <div class="filter-group filter-actions">
          <button
            type="button"
            class="btn-reset"
            (click)="searchForm.reset()"
            [disabled]="!searchForm.dirty">
            Réinitialiser
          </button>
        </div>

      </form>
    </div>

  </div>

  <!-- Table -->
  <div class="table-container">
    <app-table
      [columns]="columns"
      [data]="units()"
      [actions]="actions"
      [showActions]="isAdmin()"
      [loading]="loading()"
      [selectable]="isAdmin()"
      [striped]="true"
      [hoverable]="true"
      [pageSize]="10"
      [pageSizeOptions]="[5, 10, 25, 50]"
      [showPagination]="true"
      emptyMessage="Aucune unité trouvée"
      (selectionChange)="onSelectionChange($event)"
    >
    </app-table>
  </div>

</div>
